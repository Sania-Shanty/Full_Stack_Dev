<!DOCTYPE html>
<html>
    <head>
        <title>University Student Dashboard </title>
        <meta name="viewport" content="width=device-width",initial_scale=1.0">
        <meta charset="UTF-8">
        <style>
         *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
         }
         body{
            background: #f3f6fb;
            padding:20px;
         }
         header{
            display:flex;
            justify-content: space-between;
            align-items: center;
            background:#0b47b7;
            color:white;
            padding:15px 20px;
            border-radius:8px 8px 0 0;
         }
         .logo{
            font-size:24px;
         }
         .title{
            font-size:28px;
            font-weight:bold;
         }
         .profile{
            font-size:24px;
         }
         main{
            display:flex;
            background: white;
            border:1px solid #dddddd;
         }
         aside{
            width:220px;
            background: #0d2f83;
            color:white;
            padding:20px 15px;
         }
        aside ul{
            list-style:none;
        }
        aside li{
            margin-bottom:18px;
            padding:10px;
            border-radius: 6px;
        }
        aside li:hover{
            background:#1b4ed8;
            cursor:pointer;
        }
        section{
            flex:1;
            padding:25px;
        }
        .dashboard{
            display:grid;
            grid-template-columns: repeat(3,120px);
            gap:20px;
        }
        .card{
            background: white;
            border-radius: 12px;
            padding: 30px 20px;
            text-align:center;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.12);
        }
        .card .icon{
            font-size: 40px;
            margin-bottom: 15px;
        }
        .card h3{
            color:#ld4ed8;
            margin-bottom:10px;
        }
        .card p{
            color:#666
            font-size:14px;
        }
        </style>
    </head>
    <body>
        <header class="header">
            <div class="logo">
                SAU
            </div>
             <div class="title">
                South Asian University
            </div>
             <div class="profile">
                🧑‍🎓 Student
            </div>
        </header>
        <!--Main Section-->
        <main>
            <!--Sidebar-->
            <aside>
                <h3> Navigation Menu</h3>
                    <ul>
                        <li>Dashboard</li>
                        <li>Courses</li>
                        <li>Attendance</li>
                        <li>Results</li>
                        <li>Notices</li>
                        <li>Profile</li>
                    </ul>
            </aside>
            <!--Main Content-->
            <section>
                <h2>Student Dashboard</h2>
                <div class="card"> 
                    <div class="icon">$</div>
                    Student Information</div>
                <div class="card">
                    <div class="icon">$</div>
                    Course</div>
                <div class="card">
                    <div class="icon">$</div>
                    Results</div>
                <div class="card">
                    <div class="icon">$</div>
                    Attendance</div>
                <div class="card">
                    <div class="icon">$</div>
                    Notices</div>
                <div class="card">
                    <div class="icon">$</div>
                    Profile</div>
            </section>
        </main>     
    </body>
</html>
